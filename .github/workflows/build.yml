name: build-apk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install buildozer and system deps
        run: |
          pip install buildozer cython
          sudo apt-get update
          sudo apt-get install -y zip openjdk-17-jdk autoconf libtool pkg-config

      - name: Build APK
        run: |
          yes | buildozer android debug || true
          buildozer android debug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pocket-friend-apk
          path: bin/*.apk
